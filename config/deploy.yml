# Kamal deployment configuration
# Deploy with: kamal deploy

service: koal

image: koal

primary_role: web

servers:
  web:
    hosts:
      - YOUR_SERVER_IP
    labels:
      traefik.http.routers.koal.rule: Host(`YOUR_DOMAIN`)
    options:
      network: "private"
  worker:
    hosts:
      - YOUR_SERVER_IP
    cmd: bin/jobs
    options:
      network: "private"

registry:
  username: YOUR_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    RAILS_ENV: production
    RAILS_SERVE_STATIC_FILES: true
    RAILS_LOG_TO_STDOUT: true
    RAILS_MAX_THREADS: 3
    APPLICATION_HOST: YOUR_DOMAIN
  secret:
    - SECRET_KEY_BASE
    - SMTP_SERVER
    - SMTP_PORT
    - SMTP_USERNAME
    - SMTP_PASSWORD
    - EMAIL_DEFAULT_FROM
    - EMAIL_REPORT_EXCEPTION_TO

volumes:
  - "koal_storage:/app/storage"
  - "koal_public:/app/public"

builder:
  multiarch: false
  args:
    RUBY_VERSION: 4.0.2

healthcheck:
  path: /up
  port: 3000
  max_attempts: 7
  interval: 10s

deploy:
  pre_connect:
    - bin/rails db:prepare

traefik:
  options:
    publish:
      - "443:443"
    volume:
      - "/letsencrypt/acme.json:/letsencrypt/acme.json"
  args:
    entryPoints.web.address: ":80"
    entryPoints.websecure.address: ":443"
    certificatesResolvers.letsencrypt.acme.email: "YOUR_EMAIL"
    certificatesResolvers.letsencrypt.acme.storage: "/letsencrypt/acme.json"
    certificatesResolvers.letsencrypt.acme.httpchallenge: true
    certificatesResolvers.letsencrypt.acme.httpchallenge.entrypoint: web

accessories:
  # If you need additional services like Redis, add them here
  # redis:
  #   image: redis:7
  #   host: YOUR_SERVER_IP
  #   port: 6379
  #   volumes:
  #     - /var/lib/redis:/data

# Asset bridging for public assets
asset_path: /app/public/assets

# Boot configuration
boot:
  limit: 10
  wait: 2

# Logging
logging:
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
