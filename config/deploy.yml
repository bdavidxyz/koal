# Kamal deployment configuration
# Deploy with: kamal deploy

service: koal

image: koal

primary_role: web

servers:
  web:
    hosts:
      - YOUR_SERVER_IP
    labels:
      traefik.http.routers.koal.rule: Host(`YOUR_DOMAIN`)
    options:
      network: "private"
  worker:
    hosts:
      - YOUR_SERVER_IP
    cmd: bin/jobs
    options:
      network: "private"

registry:
  username: YOUR_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    RAILS_ENV: production
    RAILS_SERVE_STATIC_FILES: true
    RAILS_LOG_TO_STDOUT: true
    RAILS_MAX_THREADS: 3
    APPLICATION_HOST: YOUR_DOMAIN
  secret:
    - SECRET_KEY_BASE
    - SMTP_SERVER
    - SMTP_PORT
    - SMTP_USERNAME
    - SMTP_PASSWORD
    - EMAIL_DEFAULT_FROM
    - EMAIL_REPORT_EXCEPTION_TO

volumes:
  - "koal_storage:/app/storage"
  - "koal_public:/app/public"

builder:
  multiarch: false
  args:
    RUBY_VERSION: "4.0.2"

proxy:
  ssl: true
  host: YOUR_DOMAIN
  app_port: 3000
  healthcheck:
    path: /up
    interval: 10s
    timeout: 5s
    max_attempts: 7

accessories:
  # If you need additional services like Redis, add them here
  # redis:
  #   image: redis:7
  #   host: YOUR_SERVER_IP
  #   port: 6379
  #   volumes:
  #     - /var/lib/redis:/data

# Asset bridging for public assets
asset_path: /app/public/assets

# Deploy timeouts
deploy_timeout: 30
drain_timeout: 30
readiness_delay: 7

# Logging
logging:
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Command aliases
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  dbconsole: app exec --interactive --reuse "bin/rails dbconsole"
  logs: app logs --follow
  migrate: app exec "bin/rails db:migrate"
